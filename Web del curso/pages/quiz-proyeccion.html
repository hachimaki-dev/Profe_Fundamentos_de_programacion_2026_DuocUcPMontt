<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎮 Proyección Libre: Kahoot Style</title>
  <meta name="description" content="Juego interactivo para proyectar en la sala de clases a viva voz." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&family=Fira+Code:wght@600&display=swap" rel="stylesheet" />

  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            cute: ['Quicksand', 'sans-serif'],
            code: ['Fira Code', 'monospace'],
          },
          colors: {
            kahoot: {
              red:    '#e21b3c',
              blue:   '#1368ce',
              yellow: '#d89e00',
              green:  '#26890c',
              bg:     '#f2f2f2',
            }
          }
        }
      }
    }
  </script>

  <!-- Prism.js -->
  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>

  <!-- Mermaid.js -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <!-- Shared Styles (base) -->
  <link rel="stylesheet" href="../css/main.css" />

  <style>
    /* Kahoot-like Projector Styles */
    body {
      background-color: #f2f2f2;
      font-family: 'Quicksand', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    
    .presentation-container {
      width: 100vw;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Top bar */
    .top-bar {
      background: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      z-index: 50;
    }
    
    .question-title {
      font-size: 2.5rem;
      font-weight: 800;
      text-align: center;
      margin: 2rem auto;
      max-width: 90%;
      color: #333;
      line-height: 1.2;
    }

    /* Main Box */
    .media-box {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Bigger Code Font for Projector */
    pre[class*="language-"] {
      font-size: 1.8rem !important; /* Huge code */
      padding: 2rem !important;
      border-radius: 1rem !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5) !important;
    }

    .mermaid {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    .mermaid svg { max-width: 100%; height: auto; max-height: 40vh; }

    /* Answer Grid */
    .answers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .answer-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 1.5rem 2rem;
      font-size: 2rem;
      font-weight: 700;
      color: white;
      border-radius: 0.5rem;
      box-shadow: 0 4px 0px rgba(0,0,0,0.2);
      transition: all 0.2s;
      overflow: hidden;
    }

    .shape-icon {
      width: 40px;
      height: 40px;
      margin-right: 1.5rem;
      background: white;
      display: inline-block;
    }

    /* The Kahoot colors */
    .ans-0 { background-color: #e21b3c; border: 4px solid #e21b3c; } /* Red Triangle */
    .ans-0 .shape-icon { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
    
    .ans-1 { background-color: #1368ce; border: 4px solid #1368ce; } /* Blue Diamond */
    .ans-1 .shape-icon { clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }
    
    .ans-2 { background-color: #d89e00; border: 4px solid #d89e00; } /* Yellow Circle */
    .ans-2 .shape-icon { border-radius: 50%; }
    
    .ans-3 { background-color: #26890c; border: 4px solid #26890c; } /* Green Square */
    .ans-3 .shape-icon { border-radius: 4px; }

    /* Revealed state classes */
    .revealed .answer-btn { opacity: 0.3; transform: scale(0.95); }
    .revealed .answer-btn.correct-ans {
      opacity: 1;
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(255,255,255,0.8), 0 10px 0px rgba(0,0,0,0.2);
      z-index: 10;
    }
    
    .correct-badge {
      position: absolute;
      right: 20px;
      font-size: 3rem;
      animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pop {
      0% { transform: scale(0); opacity: 0; }
      80% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Bottom Control Bar */
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 3rem;
      background: white;
      border-top: 2px solid #ddd;
    }

    .action-btn {
      font-size: 1.5rem;
      font-weight: 800;
      padding: 1rem 3rem;
      border-radius: 4rem;
      cursor: pointer;
      transition: transform 0.2s;
      border: none;
    }
    .action-btn:hover { transform: scale(1.05); }
    .btn-reveal { background: #333; color: white; }
    .btn-next { background: #1368ce; color: white; }

    /* Explanation overlay */
    .explanation-box {
      margin-top: 1rem;
      background: white;
      padding: 1.5rem;
      border-radius: 1rem;
      font-size: 1.5rem;
      font-weight: 600;
      color: #333;
      text-align: center;
      border: 4px solid #26890c;
      animation: fadeInUp 0.5s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Intro/Outro screens */
    .full-screen-msg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #46178f; /* Kahoot purple */
      color: white;
      z-index: 100;
    }
    .full-screen-msg h1 { font-size: 6rem; font-weight: 800; margin-bottom: 2rem; text-align: center; }
    .btn-start {
      font-size: 3rem;
      font-weight: 800;
      padding: 1.5rem 5rem;
      border-radius: 1rem;
      background: white;
      color: #46178f;
      cursor: pointer;
      transition: transform 0.2s;
      box-shadow: 0 8px 0px rgba(0,0,0,0.3);
    }
    .btn-start:hover { transform: translateY(-5px); box-shadow: 0 13px 0px rgba(0,0,0,0.3); }
    .btn-start:active { transform: translateY(5px); box-shadow: 0 3px 0px rgba(0,0,0,0.3); }
  </style>
</head>
<body>

  <div id="app">

    <!-- START SCREEN -->
    <div v-if="state === 'start'" class="full-screen-msg">
      <h1>🎮 Repaso Interactivo<br><span class="text-3xl text-yellow-300">Responde a Viva Voz</span></h1>
      <button class="btn-start" @click="startQuiz()">¡Empezar!</button>
      <a href="../index.html" class="mt-8 text-white/50 hover:text-white text-xl underline">← Volver al Diario</a>
    </div>

    <!-- END SCREEN -->
    <div v-if="state === 'end'" class="full-screen-msg" style="background: #26890c;">
      <h1>🌟 ¡Gran Trabajo! 🌟<br><span class="text-3xl">El repaso ha terminado</span></h1>
      <a href="../index.html" class="btn-start" style="text-decoration:none; color:#26890c;">Volver al Diario</a>
    </div>

    <!-- PRESENTATION SCREEN -->
    <div v-if="state === 'question' || state === 'revealed'" class="presentation-container">
      
      <!-- Top bar -->
      <div class="top-bar">
        <a href="../index.html" class="text-xl font-bold text-gray-400 hover:text-gray-600 border border-gray-300 px-4 py-2 rounded-lg">Salir</a>
        <div class="text-2xl font-bold bg-gray-200 px-5 py-2 rounded-full text-gray-700">
          {{ currentQuestion.topic }}
        </div>
        <div class="text-2xl font-bold bg-gray-200 px-5 py-2 rounded-full text-gray-700">
          {{ currentIndex + 1 }} / {{ quizData.length }}
        </div>
      </div>

      <!-- Question Title -->
      <h2 class="question-title" v-html="currentQuestion.question"></h2>

      <!-- Media Box (Code or Diagram) -->
      <div class="media-box" v-if="currentQuestion.code || currentQuestion.diagram">
        
        <div v-if="currentQuestion.code" class="w-full h-full flex justify-center items-center">
          <pre><code class="language-python" v-html="highlightCode(currentQuestion.code)"></code></pre>
        </div>

        <div v-if="currentQuestion.diagram" class="w-full flex justify-center items-center">
           <!-- Vue re-renders mermaid when key changes -->
           <div :id="'mermaid-proy-' + currentIndex" class="mermaid" :key="currentIndex">{{ currentQuestion.diagram }}</div>
        </div>

      </div>

      <!-- Explanation Box (Appears when revealed) -->
      <div v-if="state === 'revealed' && currentQuestion.explanation" class="explanation-box">
        💡 {{ currentQuestion.explanation }}
      </div>

      <!-- Spacer -->
      <div style="flex: 1" v-if="!currentQuestion.code && !currentQuestion.diagram"></div>

      <!-- Answers Grid -->
      <div class="answers-grid" :class="{ 'revealed': state === 'revealed' }">
        
        <div v-for="(opt, oIdx) in currentQuestion.options" :key="oIdx" 
             class="answer-btn" 
             :class="['ans-' + (oIdx % 4), { 'correct-ans': oIdx === currentQuestion.correct }]">
          <span class="shape-icon"></span>
          <span v-html="opt"></span>
          <span v-if="state === 'revealed' && oIdx === currentQuestion.correct" class="correct-badge">✔️</span>
          <span v-if="state === 'revealed' && oIdx !== currentQuestion.correct" class="correct-badge" style="opacity:0.3">❌</span>
        </div>

      </div>

      <!-- Control Bar for the Teacher -->
      <div class="control-bar">
        <div class="text-gray-400 font-bold text-xl">CONTROLES DE PROFESOR:</div>
        
        <button v-if="state === 'question'" class="action-btn btn-reveal shadow-lg" @click="revealAnswer()">
          👁️ Revelar Respuesta Correcta
        </button>
        
        <button v-if="state === 'revealed'" class="action-btn btn-next shadow-lg" @click="nextQuestion()">
          Siguiente Pregunta ➡️
        </button>
      </div>

    </div>

  </div>

  <!-- Data -->
  <script src="../data/quiz-proyeccion.js"></script>

  <!-- App engine -->
  <script>
    const { createApp } = Vue;

    const app = createApp({
      data() {
        return {
          state: 'start', // 'start', 'question', 'revealed', 'end'
          currentIndex: 0,
          quizData: typeof quizPresentation !== 'undefined' ? quizPresentation : [],
        };
      },
      computed: {
        currentQuestion() {
          return this.quizData[this.currentIndex];
        }
      },
      methods: {
        highlightCode(code) {
          if (typeof Prism !== 'undefined' && Prism.languages.python && code) {
            return Prism.highlight(code, Prism.languages.python, 'python');
          }
          return code;
        },
        renderDiagram() {
          this.$nextTick(() => {
            if (typeof mermaid !== 'undefined') {
              // Reset processed flags
              document.querySelectorAll('.mermaid').forEach(el => {
                el.removeAttribute('data-processed');
              });
              
              mermaid.initialize({
                startOnLoad: false,
                theme: 'base',
                themeVariables: {
                  primaryColor: '#f8bbd0',
                  primaryBorderColor: '#f48fb1',
                  fontFamily: 'Quicksand',
                  fontSize: '24px', /* Make diagram giant */
                },
                flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis' }
              });
              mermaid.run();
            }
          });
        },
        startQuiz() {
          this.currentIndex = 0;
          this.state = 'question';
          if (this.currentQuestion.diagram) this.renderDiagram();
        },
        revealAnswer() {
          this.state = 'revealed';
        },
        nextQuestion() {
          if (this.currentIndex < this.quizData.length - 1) {
            this.currentIndex++;
            this.state = 'question';
            if (this.currentQuestion.diagram) {
              this.renderDiagram();
            } else {
              // Re-highlight newly injected prism code if needed (handled by v-html mostly, but good practice to explicitly format)
              if (this.currentQuestion.code) {
                // Prism takes care via v-html binding
              }
            }
          } else {
            this.state = 'end';
          }
        }
      },
      mounted() {
        console.log("Loaded Quiz Presenter:", this.quizData.length, "questions");
      }
    });

    app.mount('#app');
  </script>
</body>
</html>
